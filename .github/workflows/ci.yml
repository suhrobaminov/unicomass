name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "production-readiness/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify the lockfile is synchronized
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json

      - name: Apply available dependency security patches
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true

      - name: Commit security lockfile fixes to the feature branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/production-readiness/')
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: patch vulnerable npm dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install exact dependencies
        run: npm ci

      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit-all.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'for (const file of ["npm-audit-all.json", "npm-audit-production.json"]) { const audit = require("./" + file); console.log("\\n" + file, audit.metadata?.vulnerabilities ?? {}); for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) console.log(item.severity + "\\t" + name + "\\tfix=" + JSON.stringify(item.fixAvailable)); }'

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SITE_URL: https://www.unicomass.online
          VITE_SITE_URL: https://www.unicomass.online
